<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QieLend - P2P Crypto Lending</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Sans:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#d946ef",
              "primary-dark": "#c026d3",
              secondary: "#8b5cf6",
              accent: "#ec4899",
              "background-light": "#fdf4ff",
              "background-dark": "#0f0518",
              "surface-dark": "#1e0b2e",
              "surface-light": "#2d1b42",
            },
            backgroundImage: {
              "gradient-primary":
                "linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%)",
              "gradient-dark":
                "linear-gradient(180deg, #0f0518 0%, #1a0b2e 100%)",
            },
            fontFamily: {
              display: ["Manrope", "sans-serif"],
              body: ["Noto Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite will automatically handle the TSX transformation here -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
